<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #1a1a2e; color: white; }
        h1 { color: #ffd700; }
        p { font-size: 1.1em; }
        .retry-btn {
            background-color: #ffd700; color: black; border: none; padding: 10px 20px;
            font-size: 1em; border-radius: 5px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>No Internet Connection</h1>
    <p>Please connect to the internet to use the app.</p>
    <button class="retry-btn" onclick="location.reload()">Retry</button>
</body>
</html>
